# Tenet Configuration
# Generated by tenet-toolchain-setup v1.0.0
# Date: 2026-09-05T12:51:19Z

[project]
slug = "tenet-dashboard"
name = "tenet-dashboard"
repo_url = "git@github.com:inceptyon-labs/tenet-dashboard.git"

[toolchain]
# "auto" = run if installed, "required" = fail if missing, "off" = skip
semgrep = "auto"
gitleaks = "required"
trufflehog = "auto"
npm_audit = "auto"
pip_audit = "auto"
osv_scanner = "auto"
trivy = "auto"
syft = "auto"
grype = "auto"
checkov = "auto"
tfsec = "auto"
kube_linter = "auto"
conftest = "auto"
eslint = "auto"
radon = "auto"
gocyclo = "auto"
hadolint = "auto"
actionlint = "auto"
axe = "auto"
pa11y = "auto"
markdownlint = "auto"
tflint = "auto"

[models]
# Which model runs each dimension subagent. The orchestrator spawns one isolated agent per
# dimension and passes the model name through to the Agent tool. Swap `judge` when a newer
# frontier model ships; no skill files change.
judge  = "fable"    # correctness, security, solid, api-contract, privacy-data, errors, performance
worker = "sonnet"   # complexity, dependencies, debt, testing, docs, accessibility, secrets,
                    # observability, build-ci, supply-chain-license, infra-cloud,
                    # database-migrations, release-ops, toolchain
# Per-dimension override:
# [dimensions.security]
# model = "opus"

[weights]
security = 1.5
secrets = 1.5
correctness = 1.3
privacy-data = 1.3
dependencies = 1.3
errors = 1.3
supply-chain-license = 1.2
infra-cloud = 1.2
solid = 1.1
complexity = 1.1
debt = 1.1
testing = 1.1
database-migrations = 1.1
performance = 1.0
api-contract = 1.0
observability = 1.0
build-ci = 1.0
release-ops = 1.0
docs = 0.8
accessibility = 0.8

[dimensions]
# Set to "off" to disable a dimension entirely
# security = "off"
# accessibility = "off"

[suppressions]
# Accept a known finding so it stops re-appearing as critical every run. A suppressed finding
# is demoted to `info` (no score impact) and recorded with its reason — never silently dropped.
# See shared/suppressions.md. Inline `// tenet-ignore: <RULE-ID> <reason>` comments also work.
#
# Suppress a rule everywhere:  "RULE-ID" = "reason"
# "SEC-DEFAULT-005" = "internal LAN-only tool, HTTP is intentional"
#
# Suppress a rule for a path glob:
# [[suppressions.paths]]
# rule = "secrets"
# path = "config/dev-keys.ts"
# reason = "quota-capped throwaway dev keys, rotated monthly"

[testing.mutation]
# Tenet ingests mutation reports; the target project CI/local scripts run mutation tools.
# off | informational | bonus
mode = "informational"
minimum_score = 70
excellent_score = 85
bonus_points = 2
scope = "changed_files"
report_paths = [
  ".healthcheck/mutation/mutation-testing.json",
  ".healthcheck/mutation/muter.json",
  "mutation-report.json",
  "reports/mutation-testing.json"
]
